[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-tools"
version = "0.1.0"
description = "Apex-Twin Developer Tools, Flasher, Serial Monitor, and Desktop Emulator CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "pyserial>=3.5",
    "requests>=2.28.0",
    "platformio>=6.1.0",
    "matplotlib>=3.7.0",
    "folium>=0.14.0",
]

[project.scripts]
apex = "apex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apex*"]
