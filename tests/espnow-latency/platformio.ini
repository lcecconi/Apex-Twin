; PlatformIO Project Configuration for ESP-NOW Latency & Throughput Benchmark
; Standalone test to measure round-trip time (RTT), jitter, and packet loss between 2 ESP32 modules.

[platformio]
default_envs = auto_dual_s3
src_dir = src

; =============================================================================
; Common Base Configuration
; =============================================================================
[env_common]
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_filters = time, colorize

; =============================================================================
; ESP32-S3 Environments (e.g. Waveshare ESP32-S3-RLCD-4.2 / DevKitC-1)
; =============================================================================
[env:auto_dual_s3]
extends = env_common
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D ROLE_AUTO=1

[env:initiator_s3]
extends = env_common
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D ROLE_INITIATOR_DEFAULT=1

[env:responder_s3]
extends = env_common
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D ROLE_RESPONDER_DEFAULT=1

; =============================================================================
; Classic ESP32 Environments (e.g. ESP32-WROOM-32 / DevKit v1)
; =============================================================================
[env:auto_dual_esp32]
extends = env_common
platform = espressif32
board = esp32dev
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D ROLE_AUTO=1

[env:initiator_esp32]
extends = env_common
platform = espressif32
board = esp32dev
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D ROLE_INITIATOR_DEFAULT=1

[env:responder_esp32]
extends = env_common
platform = espressif32
board = esp32dev
build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D ROLE_RESPONDER_DEFAULT=1
