; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload Settings
monitor_speed = 460800
monitor_echo = yes
upload_speed = 921600

; USB CDC Configuration for ESP32-S3
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

; External Libraries (Auto-installed by PlatformIO)
lib_deps = 
    mikalhart/TinyGPSPlus @ ^1.0.3
    marian-craciunescu/ESP32Ping @ ^1.7

[env:simple_serial_bridge]
build_src_filter = +<simple_serial_bridge.cpp>

[env:gps]
build_src_filter = +<gps.cpp>
build_flags =
    ${env.build_flags}
    -D GPS_SATELLITE_REPORT_MODE=1
    -D GPS_PERF_MONITOR=1

[env:sd_dump]
build_src_filter = +<sd_dump.cpp>