; PlatformIO Project Configuration for Apex-Dash (Waveshare ESP32-S3-RLCD-4.2)
; Open-source go-kart live telemetry and racing display module

[platformio]
default_envs = apex_dash

[env:apex_dash]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; ESP32-S3-WROOM-1-N16R8 (16 MB Flash, 8 MB Octal PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

; Serial / Upload Settings
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes

build_flags = 
    -I include
