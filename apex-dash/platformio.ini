; PlatformIO Project Configuration for Apex-Dash (Waveshare ESP32-S3-RLCD-4.2)
; Open-source go-kart live telemetry and racing display module

[platformio]
default_envs = apex_dash

[env:apex_dash]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8 (16 MB Flash, 8 MB Octal PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; Serial / Upload Settings
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1
    -I include

lib_deps = 
    olikraus/U8g2 @ ^2.36.5
    adafruit/Adafruit NeoPixel @ ^1.12.0
    bblanchon/ArduinoJson @ ^7.0.4
