; PlatformIO Project Configuration for Apex-Track (ESP32-WROOM Chassis Telemetry Module)
; Generates 25 Hz kart dynamics and broadcasts Virtual CAN-FD frames over ESP-NOW

[platformio]
default_envs = track_esp32
src_dir = src
include_dir = include

[env:track_esp32]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor & Upload Settings
upload_speed = 921600
monitor_speed = 115200
monitor_echo = yes
monitor_filters = time, colorize

build_flags = 
    -I include
    -I ../apex-dash/include
    -D CORE_DEBUG_LEVEL=1
